[project]
name = "nordland-vvs-bot"
version = "0.1.0"
description = "Nordland VVS — AI support chatbot + admin dashboard (Gemini, Django)"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "psycopg[binary]>=3.2",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "pillow>=11.0",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "playwright>=1.61.0",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-playwright>=0.8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-m 'not live'"
markers = [
    "live: hits the real Vertex Gemini API (opt-in: pytest -m live)",
    "e2e: real-browser Playwright end-to-end suite (opt-in: pytest -m e2e; also marked live so the default 'not live' run skips it)",
]

[tool.uv]
# This is a Django application, not a distributable package — install deps only,
# don't try to build the project (no [build-system] needed).
package = false
