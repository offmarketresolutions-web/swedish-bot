{% load i18n %}{% comment %}Machine name as a hyperlink that opens its PDF documentation in an overlay.
Needs `machine` in context. Optional `label` overrides the link text.{% endcomment %}
<span x-data="{ open: false }" class="inline-block">
  <button type="button" class="text-nl-primary hover:text-nl-primaryd hover:underline font-medium"
          @click="open = true"
          hx-get="{% url 'dash-machine-docs' machine.pk %}" hx-target="#mdoc-{{ machine.pk }}" hx-swap="innerHTML"
          data-testid="machine-doc-link">⚙ {{ label|default:machine }}</button>
  <template x-teleport="body">
    <div x-show="open" x-cloak class="fixed inset-0 z-[60] flex items-center justify-center p-4"
         @keydown.escape.window="open = false" role="dialog" aria-modal="true">
      <div class="absolute inset-0 bg-black/40" @click="open = false"></div>
      <div class="relative w-full max-w-3xl max-h-[90vh] flex flex-col rounded-xl overflow-hidden shadow-2xl bg-white">
        <div class="flex items-center justify-between px-4 py-2.5 border-b border-nl-border">
          <h3 class="font-semibold text-sm">📘 {{ machine.vendor.name }} {{ machine.model_name }} — {% trans "Documentation" %}</h3>
          <button type="button" @click="open = false" class="text-nl-base/60 hover:text-nl-base text-xl leading-none px-1" aria-label="{% trans 'Close' %}">✕</button>
        </div>
        <div id="mdoc-{{ machine.pk }}" class="overflow-y-auto p-4 bg-nl-bg/50" style="min-height:140px">
          <p class="text-sm text-nl-base/60">{% trans "Loading…" %}</p>
        </div>
      </div>
    </div>
  </template>
</span>
