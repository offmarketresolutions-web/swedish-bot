{% comment %}Toast stack. Fire from a view with: HX-Trigger: {"toast": {"type":"success","message":"Saved"}}{% endcomment %}
<div id="nl-toast-stack" class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80 max-w-[90vw]" aria-live="polite" aria-atomic="false"></div>
<script>
(function () {
  var ICON = { success: "✓", error: "✕", info: "ℹ" };
  var CLS = { success: "border-green-500 text-green-800 bg-green-50",
              error: "border-nl-action text-nl-action bg-red-50",
              info: "border-nl-primary text-nl-primaryd bg-nl-primaryl" };
  function toast(detail) {
    if (!detail) return;
    var t = (typeof detail === "string") ? { message: detail } : detail;
    var kind = t.type || "info";
    var stack = document.getElementById("nl-toast-stack");
    var el = document.createElement("div");
    el.setAttribute("role", kind === "error" ? "alert" : "status");
    el.className = "flex items-start gap-2 rounded-lg border-l-4 shadow bg-white px-3 py-2 text-sm " + (CLS[kind] || CLS.info);
    el.innerHTML = '<span class="font-bold">' + (ICON[kind] || ICON.info) + '</span><span class="flex-1"></span>';
    el.querySelector("span.flex-1").textContent = t.message || "";
    stack.appendChild(el);
    setTimeout(function () { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 300); }, t.duration || 4000);
  }
  // HTMX HX-Trigger {"toast": {...}} dispatches a 'toast' event on the body.
  document.body.addEventListener("toast", function (e) { toast(e.detail); });
  window.nlToast = toast;  // also callable directly
})();
</script>
