{% load static %}<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nordland VVS — Support</title>
  <style>
    :root{--nl:#1a74bf;--nl-d:#0f4570;--ink:#1b2b3d}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);
         background:radial-gradient(1200px 600px at 50% -10%,#e9f3fc 0%,#f6f9fc 55%,#f6f9fc 100%)}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;padding:32px 20px 120px}
    .logo{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--nl);margin:0 0 10px}
    .tag{font-size:18px;line-height:1.5;color:#3b536b;max-width:560px;margin:0 0 26px}
    .cta{display:inline-flex;align-items:center;gap:9px;background:var(--nl);color:#fff;border:0;
         font-size:16px;font-weight:600;padding:13px 22px;border-radius:999px;cursor:pointer;
         box-shadow:0 6px 18px rgba(26,116,191,.28);transition:transform .12s,background .12s}
    .cta:hover{background:var(--nl-d);transform:translateY(-1px)}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="logo">Nordland VVS</h1>
    <p class="tag">Hej! Få hjälp direkt med din värmepump, vattenpump eller vattenrening —
       fråga oss i chatten så hjälper vi dig vidare.</p>
    <button class="cta" type="button" data-open-chat>💬 Starta chatten</button>
  </main>

  <!-- the live support widget, auto-opened on load (it shows its own blue "Chat with us"
       pointer at the bubble whenever the chat is closed) -->
  <script src="{% static 'widget/nordland-widget.js' %}?v=3" data-lang="sv" data-open="1" defer></script>
  <script>
    document.addEventListener("click", function (e) {
      if (e.target.closest("[data-open-chat]")) {
        var b = document.querySelector('[data-testid="widget-bubble"]');
        if (b && !document.querySelector(".nl-panel.nl-show")) b.click();
      }
    });
  </script>
</body>
</html>
