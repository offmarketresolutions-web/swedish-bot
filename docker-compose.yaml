services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nordland}
      POSTGRES_USER: ${POSTGRES_USER:-nordland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nordland}
    ports:
      - "5432:5432"  # exposed for host-side manage.py during local dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nordland}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      # Non-default secret so the DEBUG=0 fail-closed check passes (set a real one in prod).
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-demo-compose-secret-not-for-production}"
      # SA creds are mounted into the container; override the host path from .env.
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/gcp-vertex-ai.json
      # Temporary: the reused SA is us-central1 (non-EU). Allowed only until the
      # europe-north1 project is provisioned (V2 §S5). Remove before real PII.
      ALLOW_NON_EU_RESIDENCY: "1"
      HTTPS_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/uploads:/app/data/uploads
      # Reused Vertex service account (read-only). Swap for the client's
      # europe-north1 SA before go-live.
      - "C:/Users/vladi/OneDrive/Desktop/Projects/marketing_dashboard/markerting_dashboard/django_base/data/creds:/app/secrets:ro"
    expose:
      - "8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  caddy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
